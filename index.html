<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sello Municipal 2026 | Tracker Nominal Territorial</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0f19; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="text-slate-300 min-h-screen flex flex-col">

    <header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur-md sticky top-0 z-50 px-6 py-4">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
            <div>
                <span class="text-xs font-semibold tracking-widest text-indigo-400 uppercase flex items-center gap-2">
                    Monitoreo Control FED <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Sincronizado
                </span>
                <h1 class="text-xl font-bold text-white mt-0.5">Línea de Vida Nominal - IAL 2026</h1>
                <p class="text-xs text-slate-400">Región Huancavelica — 102 Gobiernos Locales</p>
            </div>
            
            <div class="flex items-center gap-3 w-full md:w-auto">
                <select id="filtroProvincia" class="bg-slate-900 border border-slate-800 text-slate-200 rounded-xl px-4 py-2.5 text-xs font-semibold focus:outline-none focus:border-indigo-500 transition-all cursor-pointer w-full md:w-56">
                    <option value="TODAS">Todas las Provincias</option>
                    <option value="HUANCAVELICA">Huancavelica</option>
                    <option value="ACOBAMBA">Acobamba</option>
                    <option value="ANGARAES">Angaraes</option>
                    <option value="CASTROVIRREYNA">Castrovirreyna</option>
                    <option value="CHURCAMPA">Churcampa</option>
                    <option value="HUAYTARA">Huaytará</option>
                    <option value="TAYACAJA">Tayacaja</option>
                </select>
            </div>
        </div>
    </header>

    <section class="p-6 max-w-7xl mx-auto w-full grid grid-cols-1 md:grid-cols-4 gap-4">
        <div class="bg-slate-900/60 border border-slate-800/80 p-4 rounded-xl">
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Cumplimiento Mayo</p>
            <p class="text-2xl font-black text-emerald-400 mt-1" id="kpi-cumplen">0 <span class="text-xs font-normal text-slate-500">dts</span></p>
        </div>
        <div class="bg-slate-900/60 border border-slate-800/80 p-4 rounded-xl">
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">Omisos/Pendientes Mayo</p>
            <p class="text-2xl font-black text-rose-500 mt-1" id="kpi-omisos">0 <span class="text-xs font-normal text-slate-500">dts</span></p>
        </div>
        <div class="bg-slate-900/60 border border-slate-800/80 p-4 rounded-xl">
            <p class="text-[10px] text-slate-400 uppercase font-bold tracking-wider">% Cobertura Regional</p>
            <p class="text-2xl font-black text-indigo-400 mt-1" id="kpi-porcentaje">0%</p>
        </div>
        <div class="bg-slate-900/60 border border-slate-800/80 p-4 rounded-xl flex items-center justify-center">
            <button onclick="cargarDatos()" class="w-full h-full bg-slate-800 hover:bg-indigo-600 border border-slate-700 text-white text-xs font-bold py-2 px-4 rounded-xl transition-all flex items-center justify-center gap-2 shadow-lg">
                🔄 Sincronizar Sheets
            </button>
        </div>
    </section>

    <main class="flex-1 px-6 pb-12 max-w-7xl mx-auto w-full">
        <div id="loader" class="text-center py-20">
            <div class="inline-block w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
            <p class="text-xs text-slate-500 mt-3 font-medium">Interrogando la API de Google Sheets en tiempo real...</p>
        </div>

        <div id="gridDistritos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 hidden">
            </div>
    </main>

    <script>
        // REEMPLAZA ESTA URL CON TU URL REAL GENERADA EN GOOGLE APPS SCRIPT
        const API_URL = "https://script.google.com/macros/s/AKfycbxp0ZBHoaY21Kc0_abNzqSVWdQuh8VCt5_oNVFgaciODB-0lr0-HS8BcUcaceIj1bc8gA/exec";

        let cacheData = [];

        async function cargarDatos() {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('gridDistritos').classList.add('hidden');
            
            try {
                const response = await fetch(API_URL);
                cacheData = await response.json();
                
                renderizarMatriz("TODAS");
                calcularKPIs();
            } catch (error) {
                console.error("Error cargando los datos de la API: ", error);
                alert("Error de conexión con la API de Google Sheets. Verifica los permisos de publicación.");
            } finally {
                document.getElementById('loader').classList.add('hidden');
                document.getElementById('gridDistritos').classList.remove('hidden');
            }
        }

        function renderizarMatriz(provinciaFiltro) {
            const grid = document.getElementById('gridDistritos');
            grid.innerHTML = "";

            const filtrados = provinciaFiltro === "TODAS" 
                ? cacheData 
                : cacheData.filter(d => d.provincia === provinciaFiltro);

            filtrados.forEach(d => {
                // El estado del mes actual (Mayo es el índice 4) determina la luz de alerta de la tarjeta
                const estadoMayo = d.historico[4].valor;
                const cardBorder = estadoMayo === 1 ? 'border-emerald-500/20 bg-emerald-950/5' : 'border-slate-800 bg-slate-900/30';
                const pulseLight = estadoMayo === 1 ? 'bg-emerald-500' : 'bg-rose-500';

                let historicoHtml = '';
                d.historico.forEach(mes => {
                    const colorPildora = mes.valor === 1 
                        ? 'bg-emerald-500 text-emerald-950 font-bold' 
                        : 'bg-slate-800 text-slate-500 border border-slate-700/60';
                    historicoHtml += `
                        <div class="flex flex-col items-center flex-1">
                            <span class="text-[9px] uppercase tracking-wider text-slate-500 mb-1 font-semibold">${mes.mes}</span>
                            <div class="w-full py-1 text-center text-[10px] rounded ${colorPildora}">
                                ${mes.valor === 1 ? '✓' : '—'}
                            </div>
                        </div>
                    `;
                });

                const card = `
                    <div class="p-4 rounded-xl border ${cardBorder} transition-all hover:scale-[1.02] hover:border-indigo-500/40 flex flex-col justify-between h-36">
                        <div class="flex justify-between items-start gap-2">
                            <div class="truncate">
                                <h3 class="text-xs font-bold text-white uppercase truncate">${d.nombre}</h3>
                                <p class="text-[9px] font-semibold text-slate-500 tracking-wider">${d.provincia}</p>
                            </div>
                            <span class="w-2 h-2 rounded-full ${pulseLight} flex-shrink-0 mt-1 shadow-sm"></span>
                        </div>
                        
                        <div class="flex gap-1.5 w-full mt-4">
                            ${historicoHtml}
                        </div>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', card);
            });
        }

        function calcularKPIs() {
            if (cacheData.length === 0) return;
            // Evaluamos el cumplimiento en el mes de Mayo (índice 4 del array histórico)
            const cumplen = cacheData.filter(d => d.historico[4].valor === 1).length;
            const omisos = cacheData.length - cumplen;
            const porcentaje = ((cumplen / cacheData.length) * 100).toFixed(1);

            document.getElementById('kpi-cumplen').innerHTML = `${cumplen} <span class="text-xs font-normal text-slate-500">dts</span>`;
            document.getElementById('kpi-omisos').innerHTML = `${omisos} <span class="text-xs font-normal text-slate-500">dts</span>`;
            document.getElementById('kpi-porcentaje').innerText = `${porcentaje}%`;
        }

        // Listener del Selector de Provincias
        document.getElementById('filtroProvincia').addEventListener('change', (e) => {
            renderizarMatriz(e.target.value);
        });

        // Carga automática inicial al abrir el Dashboard
        window.onload = cargarDatos;
    </script>
</body>
</html>
